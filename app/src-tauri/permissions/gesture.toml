[[permission]]
identifier = "allow-set-gesture-exclusions"
description = "Claim Android back-gesture strips while writing"
commands.allow = ["set_gesture_exclusions"]

[[permission]]
identifier = "allow-set-drawing-immersive"
description = "Sticky-immersive nav bar while a drawing tool is up"
commands.allow = ["set_drawing_immersive"]

[[permission]]
identifier = "allow-set-reading-fullscreen"
description = "Hide the status and navigation bars for reading full screen"
commands.allow = ["set_reading_fullscreen"]

[[permission]]
identifier = "allow-set-display-refresh"
description = "Ask for the panel's fastest refresh when Match display is on"
commands.allow = ["set_display_refresh"]

[[permission]]
identifier = "allow-connect-native-doodle"
description = "Open the channel the loading doodle's pen samples come down on Android"
commands.allow = ["connect_native_doodle"]
